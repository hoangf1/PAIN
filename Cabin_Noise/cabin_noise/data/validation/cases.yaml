# Case definitions shared by the GUI Validation tab and pytest. Paper pipeline (METHOD.md),
# restructured 2026-11-02: every block follows a low-fidelity paper exactly.
#
# kind:
#   verification - the block against its paper's own equations (no verdict).
#   validation   - comparison with experimental data; carries a verdict against the
#                  criterion below, fixed before the run; nothing is fitted to the data.
#   information  - no verdict.
#
# Low-fi criterion policy (2026-11-02): met when at least min_fraction of the points in range
# lie within +-tol_db of the measurement. V4a keeps its original max-error criterion.
#
# Disclosure (2026-11-02): the experimental data below were all compared earlier with the
# retired transfer-matrix pipeline (records in git, last commit 1c2c8fe), so these runs are not
# blind. No parameter of the paper pipeline is chosen from those data: the methods and inputs
# are fixed by the papers and the inputs files, written before these runs.
criteria_fixed: 2026-11-02

cases:
  # ---- verification: each block against its paper ----------------------------------------
  - id: V0a
    stage: Source
    track: tonal
    kind: verification
    check: Gutin closed form vs direct quadrature of the rotating-dipole integral
    reference: Gutin 1936 / NASA RP-1258 ch. 1
    metric: max |dL| over harmonics 1-3 and angles 45-135 deg
    target_db: 0.1
  - id: V1
    stage: TL
    track: "-"
    kind: verification
    check: CR-132602 eq. (46) vs the 0-90 deg integral of eq. (45)
    reference: NASA CR-132602 sec. 5.1
    metric: max |dTL| 63 Hz - 5 kHz
    target_db: 0.1
  - id: V2
    stage: TL
    track: "-"
    kind: verification
    check: CR-132602 eq. (52) vs a numeric solution of the power balance eq. (47)
    reference: NASA CR-132602 sec. 5.2
    metric: max |dNR| 63 Hz - 5 kHz
    target_db: 0.1
  - id: V3
    stage: Cabin
    track: "-"
    kind: verification
    check: Pipeline insertion loss vs TM-85722 IL = dTL + dABS
    reference: NASA TM-85722 eqs. (1)-(3)
    metric: max |dIL| 100 Hz - 4 kHz (residual = CR-132602's '1 +' term, small when A >> S tau)
    target_db: 0.5
  # Reproduction of the paper's own printed prediction (added 2026-11-02, criterion fixed
  # before the comparison was run). Inputs are only what CR-132602 sec. 6.1-6.2 states:
  # skin 0.09 cm + doubler 0.09 cm aluminium (sec. 6.1 spreads the doubler over the panel);
  # cavity 11.45 cm with the sec. 6.2 cavity alpha table; cabin alpha = mid-range of Fig. 4;
  # eq. (52) as printed (no area ratios). Not stated in the report, fixed here beforehand:
  # aluminium 2700 kg/m3, sea-level ISA air. The trim's blanket mass is not stated, so the
  # double-wall curve cannot be reproduced without choosing it: it is shown as information
  # only (blanket 0, a lower bound). Disclosure: before this criterion was written, a hand
  # estimate at 125 Hz and 1 kHz suggested the code lies about 3-4 dB below Fig. 14; no
  # input above was changed after that estimate.
  - id: V2p
    stage: TL
    track: broadband
    kind: verification
    check: Reproduce CR-132602 Fig. 14 (single wall) from the report's stated inputs
    reference: NASA CR-132602 sec. 6.2, Fig. 14 and Fig. 4 (V2p.csv, CR132602_fig4_alpha.csv)
    metric: max |dNR| over the six single-wall markers 125 Hz - 4 kHz
    target_db: 1.5
    inputs:
      skin_mm: 0.9
      doubler_mm: 0.9
      trim_mm: 0.4
      aluminium_density: 2700.0
      cavity_depth: 0.1145
      cavity_alpha: {125: 0.22, 250: 0.37, 500: 0.82, 1000: 0.99, 2000: 0.88, 4000: 0.63}
    defined: "2026-11-02, commit c91dbbc, before the run"
    recorded_status: check failed      # tests and the GUI smoke expect this until the case changes
    recorded: "2026-11-02: check failed, max 3.3 dB; code - Fig. 14 = -2.1, -2.6, -2.6, -3.0, -3.3, -2.7 dB (125 Hz-4 kHz), a near-constant offset"
    # POST-HOC diagnostics (2026-11-02, after seeing the result; no verdict, nothing changed in
    # the case or the code). Sec. 6.2 says Fig. 14 used eq. (53), the form that keeps the area
    # ratios S5/S4 and S5/S2; the case set S5/S2 = 1 (eq. 52 form), which the report does not
    # state for Fig. 14. The ratio itself is not stated either. With S5/S2 = 2 the single wall
    # matches within 0.3 dB at all six points; with 2.5 (App. A: sidewall about 40 % of the
    # interior area) it is +0.7 to +1.3 dB. Other single changes (upper alpha, field incidence,
    # no '1 +') leave 2-3 dB or a slope error. Double wall: a fitted blanket mass reproduces the
    # curve within 0.8 dB with either 4/eps (0.72 kg/m2) or 2/eps (1.67 kg/m2), so Fig. 14
    # cannot tell which factor the authors used.

  # ---- validation (experimental data) ---------------------------------------------------
  # V4 redefined 2026-11-03, before its first run. Fig. 18 holds measured TL only for the
  # treated panels (its bare curve is a calculation) and stops at 1 kHz, so the old range
  # (bare and treated, 250 Hz - 2 kHz) could not be run. The verdict is on the prop-plane
  # layup, the one Table I and Fig. 17c fix unambiguously (695A, 2.174 lb/ft2). Roof and aft
  # sidewall are digitized but not compared: Fig. 17a/b cannot be read for which septa they
  # carry. Range 100 Hz - 1 kHz: the report puts lab-mounting effects below 100 Hz (p. 16).
  # Method: the tool's wall transmission (CR-132602 eq. 46, single limp wall of skin +
  # treatment mass, as TM-85722 p. 13 describes for the taped panel). Disclosure: while
  # digitizing, the markers were seen, and a hand estimate (mass law about 32 dB at 1 kHz vs
  # about 45 dB measured) was made before this criterion; the policy criterion is unchanged.
  - id: V4
    stage: TL
    track: broadband
    kind: validation
    check: Lab TL of the prop-plane treated panel (695A) vs the tool's mass-law wall
    reference: NASA TM-85722 Fig. 18 and Table I (V4.csv, V4_inputs.json)
    metric: ">= 75 % of 1/3-octave bands 100 Hz - 1 kHz within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    band_min: 100
    band_max: 1000
    quantity: wall_tl
    defined: "2026-11-03, before the run"
  - id: V4a
    stage: TL
    track: broadband
    kind: validation
    check: Bare cylinder, reverberant NR (CR-132602 single wall + mass-law end caps)
    reference: NASA TP-1964 Fig. 8 (measured)
    metric: max |dNR| over 1/3-octave bands 250 Hz - 2 kHz
    target_db: 3.0
    band_min: 250
    band_max: 2000
    quantity: reverberant_nr
    defined: "2026-11-02, paper pipeline; criterion unchanged from the original V4a"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: max |dNR| 16.5 dB (250 Hz-2 kHz), mean -5.5 dB"
  - id: V4b
    stage: TL
    track: broadband
    kind: validation
    check: Stiffened trimmed cylinder, reverberant NR (CR-132602 double wall)
    reference: NASA CR-3813 Fig. E-22 (measured)
    metric: ">= 75 % of the 19 measured bands 63-4000 Hz within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: reverberant_nr
    ref_file: CR3813_E22.csv
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 5/19 within +-6 dB, mean +4.5 dB, max 22.4 dB"
  - id: V5
    stage: Source
    track: tonal
    kind: validation
    check: Flight exterior harmonics at the flush microphones (Gutin + wall doubling)
    reference: NASA CR-178004 App. A (flight 3)
    metric: ">= 75 % of measured BPF1-3 levels (both sides) within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: surface_tones
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 65/101 within +-6 dB, mean -3.3 dB, max 13.2 dB"
  - id: V5c
    stage: Source
    track: tonal
    kind: validation
    check: Static near-field harmonics at the tip (Gutin with the printed C_T, C_Q)
    reference: NACA Report 996 Figs. 12, 14 (measured)
    metric: ">= 75 % of 52 harmonic levels within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: static_nearfield
    ref_file: R996_nearfield.csv
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 15/52 within +-6 dB, max 47.4 dB (Gutin far-field formula at d/D = 0.083)"
  - id: V5b
    stage: Source
    track: broadband
    kind: validation
    check: Goody spectrum vs measured exterior bands (>= 800 Hz)
    reference: NASA CR-178004 App. D (flight 3)
    metric: ">= 75 % of measured bands 800-5000 Hz within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: tbl_bands
    defined: "2026-11-02; unchanged block (Goody)"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): met: 265/323 within +-6 dB, mean +2.7 dB"
  - id: V6
    stage: Cabin
    track: both
    kind: validation
    check: Fiberglass-treatment insertion loss in flight (TM-85722 method)
    reference: NASA CR-178004 App. J (flights 3 vs 4)
    metric: ">= 75 % of printed 1/3-octave IL values (mics 3, 6, 25-5000 Hz) within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: il_bands
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 372/519 within +-6 dB (72 %), mean +1.4 dB"
  - id: V7
    stage: Total
    track: tonal
    kind: validation
    check: Cabin harmonics from the measured exterior (interior = exterior - NR)
    reference: NASA CR-178004 App. B (flight 3)
    metric: ">= 75 % of cabin harmonic levels (mics 3, 6, harmonics 1-3, each engine) within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: cabin_tones
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 1/108 within +-6 dB, mean +17.9 dB (mass-law wall far below 0.5 f_r)"
  - id: V8
    stage: Total
    track: both
    kind: information
    check: Cross-check vs PAIN recreation
    reference: same cases run in PAIN_Program
    metric: divergence documented
