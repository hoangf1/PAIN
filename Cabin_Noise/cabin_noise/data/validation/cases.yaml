# Case definitions shared by the GUI Validation tab and pytest. Paper pipeline (METHOD.md),
# restructured 2026-11-02: every block follows a low-fidelity paper exactly.
#
# kind:
#   verification - the block against its paper's own equations (no verdict).
#   validation   - comparison with experimental data; carries a verdict against the
#                  criterion below, fixed before the run; nothing is fitted to the data.
#   information  - no verdict.
#
# Low-fi criterion policy (2026-11-02): met when at least min_fraction of the points in range
# lie within +-tol_db of the measurement. V4a keeps its original max-error criterion.
#
# Disclosure (2026-11-02): the experimental data below were all compared earlier with the
# retired transfer-matrix pipeline (records in git, last commit 1c2c8fe), so these runs are not
# blind. No parameter of the paper pipeline is chosen from those data: the methods and inputs
# are fixed by the papers and the inputs files, written before these runs.
criteria_fixed: 2026-11-02

cases:
  # ---- verification: each block against its paper ----------------------------------------
  - id: V0a
    stage: Source
    track: tonal
    kind: verification
    check: Gutin closed form vs direct quadrature of the rotating-dipole integral
    reference: Gutin 1936 / NASA RP-1258 ch. 1
    metric: max |dL| over harmonics 1-3 and angles 45-135 deg
    target_db: 0.1
  - id: V1
    stage: TL
    track: "-"
    kind: verification
    check: CR-132602 eq. (46) vs the 0-90 deg integral of eq. (45)
    reference: NASA CR-132602 sec. 5.1
    metric: max |dTL| 63 Hz - 5 kHz
    target_db: 0.1
  - id: V2
    stage: TL
    track: "-"
    kind: verification
    check: CR-132602 eq. (52) vs a numeric solution of the power balance eq. (47)
    reference: NASA CR-132602 sec. 5.2
    metric: max |dNR| 63 Hz - 5 kHz
    target_db: 0.1
  - id: V3
    stage: Cabin
    track: "-"
    kind: verification
    check: Pipeline insertion loss vs TM-85722 IL = dTL + dABS
    reference: NASA TM-85722 eqs. (1)-(3)
    metric: max |dIL| 100 Hz - 4 kHz (residual = CR-132602's '1 +' term, small when A >> S tau)
    target_db: 0.5

  # ---- validation (experimental data) ---------------------------------------------------
  - id: V4
    stage: TL
    track: broadband
    kind: validation
    check: Lab sidewall-panel TL (bare and treated)
    reference: NASA TM-85722 Fig. 18 (not digitized yet)
    metric: ">= 75 % of 1/3-octave bands 250 Hz - 2 kHz within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    band_min: 250
    band_max: 2000
    quantity: reverberant_nr
  - id: V4a
    stage: TL
    track: broadband
    kind: validation
    check: Bare cylinder, reverberant NR (CR-132602 single wall + mass-law end caps)
    reference: NASA TP-1964 Fig. 8 (measured)
    metric: max |dNR| over 1/3-octave bands 250 Hz - 2 kHz
    target_db: 3.0
    band_min: 250
    band_max: 2000
    quantity: reverberant_nr
    defined: "2026-11-02, paper pipeline; criterion unchanged from the original V4a"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: max |dNR| 16.5 dB (250 Hz-2 kHz), mean -5.5 dB"
  - id: V4b
    stage: TL
    track: broadband
    kind: validation
    check: Stiffened trimmed cylinder, reverberant NR (CR-132602 double wall)
    reference: NASA CR-3813 Fig. E-22 (measured)
    metric: ">= 75 % of the 19 measured bands 63-4000 Hz within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: reverberant_nr
    ref_file: CR3813_E22.csv
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 5/19 within +-6 dB, mean +4.5 dB, max 22.4 dB"
  - id: V5
    stage: Source
    track: tonal
    kind: validation
    check: Flight exterior harmonics at the flush microphones (Gutin + wall doubling)
    reference: NASA CR-178004 App. A (flight 3)
    metric: ">= 75 % of measured BPF1-3 levels (both sides) within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: surface_tones
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 65/101 within +-6 dB, mean -3.3 dB, max 13.2 dB"
  - id: V5c
    stage: Source
    track: tonal
    kind: validation
    check: Static near-field harmonics at the tip (Gutin with the printed C_T, C_Q)
    reference: NACA Report 996 Figs. 12, 14 (measured)
    metric: ">= 75 % of 52 harmonic levels within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: static_nearfield
    ref_file: R996_nearfield.csv
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 15/52 within +-6 dB, max 47.4 dB (Gutin far-field formula at d/D = 0.083)"
  - id: V5b
    stage: Source
    track: broadband
    kind: validation
    check: Goody spectrum vs measured exterior bands (>= 800 Hz)
    reference: NASA CR-178004 App. D (flight 3)
    metric: ">= 75 % of measured bands 800-5000 Hz within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: tbl_bands
    defined: "2026-11-02; unchanged block (Goody)"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): met: 265/323 within +-6 dB, mean +2.7 dB"
  - id: V6
    stage: Cabin
    track: both
    kind: validation
    check: Fiberglass-treatment insertion loss in flight (TM-85722 method)
    reference: NASA CR-178004 App. J (flights 3 vs 4)
    metric: ">= 75 % of printed 1/3-octave IL values (mics 3, 6, 25-5000 Hz) within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: il_bands
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 372/519 within +-6 dB (72 %), mean +1.4 dB"
  - id: V7
    stage: Total
    track: tonal
    kind: validation
    check: Cabin harmonics from the measured exterior (interior = exterior - NR)
    reference: NASA CR-178004 App. B (flight 3)
    metric: ">= 75 % of cabin harmonic levels (mics 3, 6, harmonics 1-3, each engine) within +-6 dB"
    tol_db: 6.0
    min_fraction: 0.75
    quantity: cabin_tones
    defined: "2026-11-02, paper pipeline"
    recorded: "2026-11-02 paper pipeline (definition commit 93bbeb9): not met: 1/108 within +-6 dB, mean +17.9 dB (mass-law wall far below 0.5 f_r)"
  - id: V8
    stage: Total
    track: both
    kind: information
    check: Cross-check vs PAIN recreation
    reference: same cases run in PAIN_Program
    metric: divergence documented
