# Validation map layout: the paper pipeline's stages as blocks (col, row on a grid), grouped
# into frames, with arrows for what feeds what. Every case in cases.yaml appears under exactly
# one block (tests/test_validation_map.py).
title: "Cabin_Noise paper pipeline: verification and validation by stage"

groups:
  - id: inputs
    title: "Operating point"
  - id: exterior
    title: "Exterior level"
  - id: transmission
    title: "Noise reduction (CR-132602)"
  - id: cabin
    title: "Cabin"
  - id: outputs
    title: "Outputs"

blocks:
  - id: mission
    title: "Mission & atmosphere"
    note: "ISA, IAS -> TAS, thrust & torque"
    group: inputs
    col: 0
    row: 0
    cases: []
  - id: tones
    title: "Propeller tones"
    note: "Gutin (RP-1258 ch. 1)"
    group: exterior
    col: 1
    row: 0
    cases: [V0a, V5, V5c]
  - id: tbl
    title: "Boundary layer"
    note: "Goody; diffuse = wall / 2"
    group: exterior
    col: 1
    row: 1
    cases: [V5b]
  - id: sidewall
    title: "Sidewall NR"
    note: "eqs. 46, 52; openings TM-85722 eq. 1"
    group: transmission
    col: 2
    row: 0
    cases: [V1, V2, V4, V4a, V4b]
  - id: room
    title: "Cabin level"
    note: "interior = exterior - NR; Sabine"
    group: cabin
    col: 3
    row: 0
    cases: [V7, V8]
  - id: seats
    title: "Seat spread"
    note: "95th percentile, Schroeder"
    group: cabin
    col: 3
    row: 1
    cases: []
  - id: il
    title: "Insertion loss"
    note: "IL = dTL + dABS (TM-85722)"
    group: outputs
    col: 4
    row: 0
    cases: [V3, V6]
  - id: totals
    title: "Bands & weighting"
    note: "1/3 octaves, A / C weighting"
    group: outputs
    col: 4
    row: 1
    cases: []

edges:
  - [mission, tones]
  - [mission, tbl]
  - [tones, sidewall]
  - [tbl, sidewall]
  - [sidewall, room]
  - [room, seats]
  - [room, il]
  - [room, totals]
