<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- Floor angle θ₀ of the cabin cross-section (CR-3813 Fig. 1 convention: θ from the bottom centreline).
       Drawn at θ₀ = 62.6° (CR-172428 small-diameter aircraft); a = 150 px. -->
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- cabin (above the floor) and underfloor bay -->
  <path d="M66.8,269 A150,150 0 1 1 333.2,269 Z" fill="#dbe9f7" stroke="none"/>
  <path d="M66.8,269 A150,150 0 0 0 333.2,269 Z" fill="#eeeeee" stroke="none"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#222" stroke-width="2.5"/>
  <line x1="66.8" y1="269" x2="333.2" y2="269" stroke="#222" stroke-width="3"/>
  <text x="228" y="102" text-anchor="middle" fill="#1f4e79">cabin (CYL2D section)</text>
  <text x="200" y="320" text-anchor="middle" fill="#666" font-size="12">underfloor bay</text>
  <!-- axis, bottom centreline, radius to the floor junction -->
  <circle cx="200" cy="200" r="3" fill="#222"/>
  <line x1="200" y1="200" x2="200" y2="350" stroke="#b03030" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="200" y1="200" x2="333.2" y2="269" stroke="#b03030" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="200" y1="200" x2="93.9" y2="93.9" stroke="#222" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="156" y="140" fill="#222" font-style="italic">a</text>
  <!-- θ₀ arc from the bottom centreline to the floor junction -->
  <path d="M200,245 A45,45 0 0 0 239.9,220.7" fill="none" stroke="#b03030" stroke-width="2"/>
  <text x="205" y="234" fill="#b03030" font-weight="bold" font-size="13">θ₀</text>
  <circle cx="333.2" cy="269" r="4" fill="#b03030"/>
  <text x="328" y="290" text-anchor="end" fill="#b03030" font-size="12">floor–shell junction</text>
  <!-- floor width w -->
  <line x1="66.8" y1="180" x2="333.2" y2="180" stroke="#333" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="66.8" y1="174" x2="66.8" y2="269" stroke="#333" stroke-width="0.8"/>
  <line x1="333.2" y1="174" x2="333.2" y2="269" stroke="#333" stroke-width="0.8"/>
  <text x="110" y="174" fill="#333" font-style="italic">w</text>
  <!-- floor height h above the lowest point of the shell -->
  <line x1="200" y1="350" x2="372" y2="350" stroke="#333" stroke-width="0.8"/>
  <line x1="333.2" y1="269" x2="372" y2="269" stroke="#333" stroke-width="0.8"/>
  <line x1="365" y1="350" x2="365" y2="269" stroke="#333" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="372" y="315" fill="#333" font-style="italic">h</text>
  <!-- equations -->
  <g font-size="15" fill="#222">
    <text x="410" y="70" font-weight="bold">Floor angle θ₀</text>
    <text x="410" y="96" font-size="13" fill="#555">θ measured from the bottom centreline</text>
    <text x="410" y="140">from the floor height h:</text>
    <text x="430" y="166">θ₀ = arccos(1 − h / a)</text>
    <text x="410" y="206">from the floor width w:</text>
    <text x="430" y="232">θ₀ = arcsin(w / 2a)   (h ≤ a)</text>
    <text x="410" y="272">check:  w = 2a sin θ₀</text>
    <text x="466" y="296">h = a (1 − cos θ₀)</text>
    <text x="410" y="340" font-size="13" fill="#555">drawn at θ₀ = 62.6° (CR-172428 small diameter)</text>
    <text x="410" y="360" font-size="13" fill="#555">a: shell radius used by the run (input a)</text>
  </g>
</svg>
